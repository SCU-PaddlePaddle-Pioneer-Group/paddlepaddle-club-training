<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">二维互相关计算示例</title><desc id="desc">五乘五输入与三乘三竖直边缘检测核进行互相关，展示一个输出值的计算。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9ca3af"/></marker></defs>
  <rect width="1200" height="560" fill="#fafafa"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <text x="64" y="64" fill="#111827" font-size="27" font-weight="700">一次“卷积”算了什么？</text><text x="64" y="94" fill="#6b7280" font-size="15">stride = 1　·　padding = 0　·　实际计算为互相关</text><line x1="64" y1="116" x2="1136" y2="116" stroke="#e5e7eb"/>
    <text x="118" y="158" fill="#111827" font-size="17" font-weight="600">输入 X</text>
    <g transform="translate(70,185)" font-size="18" text-anchor="middle"><rect x="56" width="168" height="168" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><g stroke="#d1d5db" fill="none"><rect width="280" height="280"/><path d="M56 0V280M112 0V280M168 0V280M224 0V280M0 56H280M0 112H280M0 168H280M0 224H280"/></g><g fill="#111827"><text x="28" y="35">1</text><text x="84" y="35">1</text><text x="140" y="35">1</text><text x="196" y="35">0</text><text x="252" y="35">0</text><text x="28" y="91">1</text><text x="84" y="91">1</text><text x="140" y="91">1</text><text x="196" y="91">0</text><text x="252" y="91">0</text><text x="28" y="147">1</text><text x="84" y="147">1</text><text x="140" y="147">1</text><text x="196" y="147">0</text><text x="252" y="147">0</text><text x="28" y="203">1</text><text x="84" y="203">1</text><text x="140" y="203">1</text><text x="196" y="203">0</text><text x="252" y="203">0</text><text x="28" y="259">1</text><text x="84" y="259">1</text><text x="140" y="259">1</text><text x="196" y="259">0</text><text x="252" y="259">0</text></g></g>
    <text x="485" y="158" fill="#111827" font-size="17" font-weight="600">卷积核 K</text>
    <g transform="translate(450,235)" font-size="18" text-anchor="middle"><rect width="180" height="180" fill="#fff" stroke="#111827"/><path d="M60 0V180M120 0V180M0 60H180M0 120H180" stroke="#d1d5db"/><g fill="#111827"><text x="30" y="38">1</text><text x="90" y="38">0</text><text x="150" y="38">−1</text><text x="30" y="98">1</text><text x="90" y="98">0</text><text x="150" y="98">−1</text><text x="30" y="158">1</text><text x="90" y="158">0</text><text x="150" y="158">−1</text></g></g>
    <line x1="370" y1="325" x2="430" y2="325" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="650" y1="325" x2="710" y2="325" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(750,202)"><text x="0" y="0" fill="#3b82f6" font-size="16" font-weight="600">逐元素相乘，再求和</text><text x="0" y="50" fill="#111827" font-size="21">(1×1 + 1×0 + 0×−1)</text><text x="0" y="88" fill="#111827" font-size="21">+ (1×1 + 1×0 + 0×−1)</text><text x="0" y="126" fill="#111827" font-size="21">+ (1×1 + 1×0 + 0×−1)</text><line x1="0" y1="152" x2="340" y2="152" stroke="#e5e7eb"/><text x="0" y="200" fill="#3b82f6" font-size="29" font-weight="700">= 3</text><text x="75" y="198" fill="#6b7280" font-size="15">检测到垂直亮度边界</text></g>
    <text x="64" y="516" fill="#6b7280" font-size="14">卷积核继续向右、向下滑动，最终得到 3 × 3 输出特征图。</text>
  </g>
</svg>
