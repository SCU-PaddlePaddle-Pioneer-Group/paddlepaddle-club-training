<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">填充步幅与膨胀率</title><desc id="desc">对比填充、步幅和膨胀率对卷积采样与输出尺寸的影响。</desc><rect width="1200" height="470" fill="#fafafa"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="64" fill="#111827" font-size="27" font-weight="700">决定输出尺寸的三个变量</text><text x="64" y="94" fill="#6b7280" font-size="15">K = 3 时的直观对比</text><line x1="64" y1="116" x2="1136" y2="116" stroke="#e5e7eb"/><line x1="400" y1="145" x2="400" y2="410" stroke="#e5e7eb"/><line x1="800" y1="145" x2="800" y2="410" stroke="#e5e7eb"/>
    <g transform="translate(64,145)"><text x="0" y="25" fill="#3b82f6" font-size="20" font-weight="700">01</text><text x="48" y="25" fill="#111827" font-size="20" font-weight="600">Padding = 1</text><text x="48" y="53" fill="#6b7280" font-size="14">边界外补一圈；S=1 时保持 5×5</text><g transform="translate(85,78)" stroke="#d1d5db"><rect width="175" height="175" fill="#fff" stroke="#3b82f6" stroke-width="2"/><path d="M35 0V175M70 0V175M105 0V175M140 0V175M0 35H175M0 70H175M0 105H175M0 140H175"/><rect x="35" y="35" width="105" height="105" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/></g></g>
    <g transform="translate(432,145)"><text x="0" y="25" fill="#3b82f6" font-size="20" font-weight="700">02</text><text x="48" y="25" fill="#111827" font-size="20" font-weight="600">Stride = 2</text><text x="48" y="53" fill="#6b7280" font-size="14">窗口每次跨两格；输出通常缩小</text><g transform="translate(85,78)" stroke="#d1d5db"><rect width="175" height="175" fill="#fff"/><path d="M35 0V175M70 0V175M105 0V175M140 0V175M0 35H175M0 70H175M0 105H175M0 140H175"/><rect width="105" height="105" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><path d="M107 52H154" stroke="#3b82f6" stroke-width="2"/><path d="M146 45L160 52L146 59Z" fill="#3b82f6" stroke="none"/></g></g>
    <g transform="translate(832,145)"><text x="0" y="25" fill="#3b82f6" font-size="20" font-weight="700">03</text><text x="48" y="25" fill="#111827" font-size="20" font-weight="600">Dilation = 2</text><text x="48" y="53" fill="#6b7280" font-size="14">3×3 核的有效覆盖范围变为 5×5</text><g transform="translate(85,78)" stroke="#d1d5db"><rect width="175" height="175" fill="#fff"/><path d="M35 0V175M70 0V175M105 0V175M140 0V175M0 35H175M0 70H175M0 105H175M0 140H175"/><g fill="#3b82f6" stroke="none"><circle cx="17.5" cy="17.5" r="5"/><circle cx="87.5" cy="17.5" r="5"/><circle cx="157.5" cy="17.5" r="5"/><circle cx="17.5" cy="87.5" r="5"/><circle cx="87.5" cy="87.5" r="5"/><circle cx="157.5" cy="87.5" r="5"/><circle cx="17.5" cy="157.5" r="5"/><circle cx="87.5" cy="157.5" r="5"/><circle cx="157.5" cy="157.5" r="5"/></g></g></g>
  </g>
</svg>
