<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">最大池化与平均池化</title><desc id="desc">四乘四特征图经过二乘二、步幅二的最大池化和平均池化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9ca3af"/></marker></defs><rect width="1200" height="450" fill="#fafafa"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="64" fill="#111827" font-size="27" font-weight="700">池化：两种局部摘要</text><text x="64" y="94" fill="#6b7280" font-size="15">窗口 2×2　·　stride = 2　·　无可训练权重</text><line x1="64" y1="116" x2="1136" y2="116" stroke="#e5e7eb"/><text x="115" y="151" fill="#111827" font-size="16" font-weight="600">输入特征图</text>
    <g transform="translate(64,176)" text-anchor="middle" font-size="18"><rect width="224" height="224" fill="#fff" stroke="#111827"/><path d="M56 0V224M112 0V224M168 0V224M0 56H224M0 112H224M0 168H224" stroke="#d1d5db"/><rect width="112" height="112" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><g fill="#111827"><text x="28" y="35">1</text><text x="84" y="35">3</text><text x="140" y="35">2</text><text x="196" y="35">4</text><text x="28" y="91">5</text><text x="84" y="91">2</text><text x="140" y="91">7</text><text x="196" y="91">1</text><text x="28" y="147">0</text><text x="84" y="147">6</text><text x="140" y="147">3</text><text x="196" y="147">8</text><text x="28" y="203">4</text><text x="84" y="203">2</text><text x="140" y="203">1</text><text x="196" y="203">5</text></g></g>
    <line x1="312" y1="288" x2="393" y2="288" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="352" y="273" text-anchor="middle" fill="#3b82f6" font-size="13">max</text><text x="445" y="151" fill="#111827" font-size="16" font-weight="600">最大池化</text>
    <g transform="translate(412,210)" text-anchor="middle" font-size="20"><rect width="156" height="156" fill="#fff" stroke="#111827"/><path d="M78 0V156M0 78H156" stroke="#d1d5db"/><g fill="#111827"><text x="39" y="48">5</text><text x="117" y="48">7</text><text x="39" y="126">6</text><text x="117" y="126">8</text></g></g>
    <line x1="594" y1="288" x2="675" y2="288" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/><text x="634" y="273" text-anchor="middle" fill="#3b82f6" font-size="13">mean</text><text x="720" y="151" fill="#111827" font-size="16" font-weight="600">平均池化</text>
    <g transform="translate(694,210)" text-anchor="middle" font-size="20"><rect width="156" height="156" fill="#fff" stroke="#111827"/><path d="M78 0V156M0 78H156" stroke="#d1d5db"/><g fill="#111827"><text x="39" y="48">2.75</text><text x="117" y="48">3.5</text><text x="39" y="126">3</text><text x="117" y="126">4.25</text></g></g>
    <g transform="translate(920,185)"><line x1="0" y1="0" x2="0" y2="190" stroke="#3b82f6" stroke-width="2"/><text x="24" y="8" fill="#111827" font-size="16" font-weight="600">最大池化</text><text x="24" y="34" fill="#6b7280" font-size="14">保留强响应</text><text x="24" y="90" fill="#111827" font-size="16" font-weight="600">平均池化</text><text x="24" y="116" fill="#6b7280" font-size="14">保留整体均值</text><text x="24" y="174" fill="#3b82f6" font-size="14">具体选择由验证结果决定</text></g>
  </g>
</svg>
