<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">卷积神经网络的典型数据流</title>
  <desc id="desc">输入依次经过卷积、归一化与激活、下采样、深层特征提取、全局平均池化和分类。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9ca3af"/></marker></defs>
  <rect width="1200" height="390" fill="#fafafa"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <text x="64" y="64" fill="#111827" font-size="27" font-weight="700">CNN 的典型数据流</text>
    <text x="64" y="94" fill="#6b7280" font-size="15">空间尺寸逐步减小，通道数逐步增加</text>
    <line x1="64" y1="116" x2="1136" y2="116" stroke="#e5e7eb"/>
    <g transform="translate(70,160)"><rect width="120" height="120" rx="4" fill="#fff" stroke="#111827" stroke-width="1.5"/><rect x="24" y="24" width="72" height="72" fill="#eff6ff" stroke="#3b82f6"/><path d="M24 83L44 62L59 75L76 52L96 78V96H24Z" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="45" cy="45" r="7" fill="#3b82f6"/><text x="60" y="148" text-anchor="middle" fill="#111827" font-size="15" font-weight="600">输入</text><text x="60" y="172" text-anchor="middle" fill="#6b7280" font-size="13">3 × 32 × 32</text></g>
    <g transform="translate(270,160)"><rect width="120" height="120" rx="4" fill="#fff" stroke="#111827" stroke-width="1.5"/><rect x="29" y="29" width="58" height="58" fill="none" stroke="#3b82f6" stroke-width="1.5"/><rect x="36" y="36" width="58" height="58" fill="none" stroke="#3b82f6" stroke-width="1.5"/><path d="M29 29L36 36M87 29L94 36M87 87L94 94" stroke="#3b82f6"/><text x="60" y="148" text-anchor="middle" fill="#111827" font-size="15" font-weight="600">卷积 3×3</text><text x="60" y="172" text-anchor="middle" fill="#6b7280" font-size="13">32 × 32 × 32</text></g>
    <g transform="translate(470,160)"><rect width="120" height="120" rx="4" fill="#fff" stroke="#111827" stroke-width="1.5"/><path d="M24 78Q38 40 51 78T78 78T98 54" fill="none" stroke="#3b82f6" stroke-width="2.5"/><line x1="24" y1="88" x2="98" y2="88" stroke="#d1d5db"/><text x="60" y="148" text-anchor="middle" fill="#111827" font-size="15" font-weight="600">BN + ReLU</text><text x="60" y="172" text-anchor="middle" fill="#6b7280" font-size="13">非线性</text></g>
    <g transform="translate(670,160)"><rect width="120" height="120" rx="4" fill="#fff" stroke="#111827" stroke-width="1.5"/><g fill="none" stroke="#3b82f6"><rect x="27" y="27" width="28" height="28"/><rect x="65" y="27" width="28" height="28"/><rect x="27" y="65" width="28" height="28"/><rect x="65" y="65" width="28" height="28"/></g><circle cx="41" cy="41" r="4" fill="#3b82f6"/><circle cx="79" cy="79" r="4" fill="#3b82f6"/><text x="60" y="148" text-anchor="middle" fill="#111827" font-size="15" font-weight="600">下采样</text><text x="60" y="172" text-anchor="middle" fill="#6b7280" font-size="13">64 × 16 × 16</text></g>
    <g transform="translate(870,160)"><rect width="120" height="120" rx="4" fill="#fff" stroke="#111827" stroke-width="1.5"/><g fill="none" stroke="#3b82f6" stroke-width="1.5"><rect x="25" y="28" width="70" height="14"/><rect x="32" y="52" width="56" height="14"/><rect x="39" y="76" width="42" height="14"/></g><text x="60" y="148" text-anchor="middle" fill="#111827" font-size="15" font-weight="600">深层特征</text><text x="60" y="172" text-anchor="middle" fill="#6b7280" font-size="13">128 × 8 × 8</text></g>
    <g transform="translate(1070,160)"><rect width="70" height="120" rx="4" fill="#fff" stroke="#111827" stroke-width="1.5"/><g fill="#3b82f6"><rect x="19" y="30" width="7" height="58"/><rect x="32" y="48" width="7" height="40"/><rect x="45" y="65" width="7" height="23"/></g><text x="35" y="148" text-anchor="middle" fill="#111827" font-size="15" font-weight="600">分类</text><text x="35" y="172" text-anchor="middle" fill="#6b7280" font-size="13">10 logits</text></g>
    <g stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"><line x1="198" y1="220" x2="257" y2="220"/><line x1="398" y1="220" x2="457" y2="220"/><line x1="598" y1="220" x2="657" y2="220"/><line x1="798" y1="220" x2="857" y2="220"/><line x1="998" y1="220" x2="1057" y2="220"/></g>
  </g>
</svg>
