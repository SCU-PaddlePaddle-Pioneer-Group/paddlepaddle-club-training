# 将 DOMAIN 替换为真实域名，例如 notes.example.com。
# 将 SITE_ROOT 替换为 Hugo public 目录在服务器上的绝对路径，
# 例如 /srv/tech-notes/current。

server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN;
    root SITE_ROOT;
    index index.html;

    # Hugo 默认会为文章生成目录形式的 URL。
    location / {
        try_files $uri $uri/ =404;
    }

    # 带内容哈希的静态资源可长时间缓存；本示例站文件名未加哈希，
    # 因此只设置较短缓存，避免更新后长期看到旧样式。
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 不向客户端暴露 nginx 详细版本。
    server_tokens off;

    access_log /var/log/nginx/tech-notes.access.log;
    error_log  /var/log/nginx/tech-notes.error.log warn;
}
