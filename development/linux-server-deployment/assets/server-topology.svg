<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Linux 与 Nginx 静态网站拓扑</title><desc id="desc">用户经过 DNS 和防火墙访问 Ubuntu 主机的 Nginx，Nginx 从站点目录读取 Hugo 静态文件，并把访问与错误写入日志。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b44f14"/></marker><style>.bg{fill:#fff4ea}.box{fill:#fffdf9;stroke:#492b1c;stroke-width:3}.host{fill:#fff8ef;stroke:#b44f14;stroke-width:4;stroke-dasharray:10 8}.h{font:700 34px 'Microsoft YaHei',sans-serif;fill:#3d2417}.t{font:24px 'Microsoft YaHei',sans-serif;fill:#492b1c}.s{font:19px 'Microsoft YaHei',sans-serif;fill:#765744}.l{stroke:#b44f14;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1200" height="620" rx="32"/><text class="h" x="60" y="72">静态站点部署：请求进入服务器后发生了什么</text>
  <rect class="box" x="55" y="210" width="170" height="130" rx="20"/><text class="t" x="140" y="265" text-anchor="middle">访客</text><text class="s" x="140" y="305" text-anchor="middle">浏览器</text>
  <rect class="box" x="285" y="210" width="170" height="130" rx="20"/><text class="t" x="370" y="265" text-anchor="middle">DNS</text><text class="s" x="370" y="305" text-anchor="middle">DOMAIN → IP</text>
  <rect class="host" x="520" y="120" width="620" height="400" rx="28"/><text class="t" x="560" y="165">Ubuntu 主机</text>
  <rect class="box" x="565" y="210" width="170" height="130" rx="20"/><text class="t" x="650" y="260" text-anchor="middle">UFW</text><text class="s" x="650" y="300" text-anchor="middle">22 / 80 / 443</text>
  <rect class="box" x="790" y="210" width="150" height="130" rx="20"/><text class="t" x="865" y="260" text-anchor="middle">Nginx</text><text class="s" x="865" y="300" text-anchor="middle">server block</text>
  <rect class="box" x="985" y="190" width="120" height="170" rx="20"/><text class="t" x="1045" y="245" text-anchor="middle">站点</text><text class="s" x="1045" y="285" text-anchor="middle">HTML</text><text class="s" x="1045" y="315" text-anchor="middle">CSS / JS</text>
  <rect class="box" x="760" y="400" width="250" height="80" rx="18"/><text class="s" x="885" y="448" text-anchor="middle">access.log / error.log</text>
  <line class="l" x1="225" y1="275" x2="285" y2="275"/><line class="l" x1="455" y1="275" x2="565" y2="275"/><line class="l" x1="735" y1="275" x2="790" y2="275"/><line class="l" x1="940" y1="275" x2="985" y2="275"/><line class="l" x1="865" y1="340" x2="865" y2="400"/>
  <text class="s" x="600" y="575" text-anchor="middle">证书让 443 端口上的 HTTPS 能验证站点身份并加密传输；它不能替代系统更新、最小权限和日志检查。</text>
</svg>
