<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    <script src="{{ "js/main.js" | relURL }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <nav aria-label="主导航">
        <a href="{{ site.Home.RelPermalink }}">首页</a>
        <a href="{{ "posts/" | relURL }}">文章</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换明暗主题" aria-pressed="false">明暗</button>
    </header>
    <main id="main" class="page-shell">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <p>用 Hugo 构建 · 示例内容不代表真实组织</p>
    </footer>
  </body>
</html>
