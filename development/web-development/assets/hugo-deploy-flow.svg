<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Hugo 构建与部署流程</title><desc id="desc">Markdown、模板和静态资源经过 Hugo 构建生成 public 目录，再由 GitHub Actions 上传为 Pages 站点。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d43c0"/></marker><style>.bg{fill:#f7f3ff}.box{fill:#fff;stroke:#302443;stroke-width:3}.h{font:700 34px 'Microsoft YaHei',sans-serif;fill:#251a35}.t{font:24px 'Microsoft YaHei',sans-serif;fill:#302443}.s{font:19px 'Microsoft YaHei',sans-serif;fill:#62566f}.l{stroke:#6d43c0;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1200" height="560" rx="32"/><text class="h" x="60" y="72">Hugo 把“内容”和“页面结构”组装成静态网站</text>
  <rect class="box" x="60" y="140" width="230" height="260" rx="22"/><text class="t" x="175" y="195" text-anchor="middle">源文件</text><text class="s" x="175" y="245" text-anchor="middle">content/*.md</text><text class="s" x="175" y="285" text-anchor="middle">layouts/*.html</text><text class="s" x="175" y="325" text-anchor="middle">static/css/*.css</text><text class="s" x="175" y="365" text-anchor="middle">hugo.toml</text>
  <rect class="box" x="400" y="180" width="180" height="180" rx="90"/><text class="t" x="490" y="260" text-anchor="middle">Hugo</text><text class="s" x="490" y="300" text-anchor="middle">构建</text>
  <rect class="box" x="690" y="140" width="200" height="260" rx="22"/><text class="t" x="790" y="195" text-anchor="middle">public/</text><text class="s" x="790" y="245" text-anchor="middle">index.html</text><text class="s" x="790" y="285" text-anchor="middle">posts/</text><text class="s" x="790" y="325" text-anchor="middle">css/ · js/</text><text class="s" x="790" y="365" text-anchor="middle">sitemap.xml</text>
  <rect class="box" x="990" y="180" width="160" height="180" rx="22"/><text class="t" x="1070" y="250" text-anchor="middle">Pages</text><text class="s" x="1070" y="290" text-anchor="middle">公开访问</text>
  <line class="l" x1="290" y1="270" x2="400" y2="270"/><line class="l" x1="580" y1="270" x2="690" y2="270"/><line class="l" x1="890" y1="270" x2="990" y2="270"/>
  <text class="s" x="600" y="470" text-anchor="middle">本地：hugo server 预览　　生产：hugo --minify　　持续部署：GitHub Actions</text>
</svg>
